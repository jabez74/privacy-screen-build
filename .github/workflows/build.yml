name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Unzip and Move Files
        run: |
          unzip PrivacyScreen.zip
          # If the zip created a subfolder, bring everything out to the main space
          if [ -d "PrivacyScreen" ]; then
            mv PrivacyScreen/* . 2>/dev/null || true
            mv PrivacyScreen/.* . 2>/dev/null || true
          fi
          # Double check if files are nested deeper and find gradlew
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          if [ ! -z "$GRADLEW_PATH" ]; then
            DIR_PATH=$(dirname "$GRADLEW_PATH")
            echo "Found gradlew in $DIR_PATH, moving contents..."
            mv $DIR_PATH/* . 2>/dev/null || true
            mv $DIR_PATH/.* . 2>/dev/null || true
          fi

      - name: Make Gradle Executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: privacy-screen-apk
          path: "**/build/outputs/apk/debug/app-debug.apk"
