name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Unzip Project Files
        run: |
          unzip PrivacyScreen.zip
          if [ -d "PrivacyScreen" ]; then
            mv PrivacyScreen/* .
            mv PrivacyScreen/.* . 2>/dev/null || true
            rm -rf PrivacyScreen
          fi

      - name: Make Gradle Executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: privacy-screen-apk
          path: app/build/outputs/apk/debug/app-debug.apk
